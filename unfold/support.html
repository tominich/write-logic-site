<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Support page for Unfold: Flashcards, the flashcard app for iPhone.">
<title>Unfold: Flashcards Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Layout: one readable column under a band in the app icon's blue, with a short summary card up top. */
  :root {
    --bg: #F6F8FD;
    --surface: #FFFFFF;
    --fg: #14224A;
    --muted: #55617F;
    --line: #DCE3F2;
    --brand: #0A4FDF;
    --brand-fg: #FFFFFF;
    --sun: #FFC21A;
    --font-display: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1226; --surface: #131D3A; --fg: #E6EBF7; --muted: #A2ADC9;
      --line: #263359; --brand: #1E5FE8; --brand-fg: #FFFFFF; --sun: #FFD54A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1226; --surface: #131D3A; --fg: #E6EBF7; --muted: #A2ADC9;
    --line: #263359; --brand: #1E5FE8; --brand-fg: #FFFFFF; --sun: #FFD54A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { background: var(--brand); color: var(--brand-fg); }
  header .wrap { padding-block: 40px 56px; display: flex; flex-direction: column; gap: 6px; }
  .eyebrow {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sun);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(32px, 7vw, 44px);
    line-height: 1.1;
    margin: 0;
    text-wrap: balance;
  }
  .dated { margin: 0; opacity: 0.85; font-size: 15px; }

  main .wrap { padding-block: 0 64px; display: flex; flex-direction: column; gap: 36px; }
  .summary {
    margin-top: -28px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: 0 10px 30px -18px rgba(2, 26, 92, 0.45);
  }
  .summary p { margin: 0; font-size: 19px; }
  .summary strong { color: var(--brand); }
  :root[data-theme="dark"] .summary strong { color: var(--sun); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .summary strong { color: var(--sun); } }

  section { display: flex; flex-direction: column; gap: 10px; }
  h2 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    line-height: 1.25;
    margin: 0;
    text-wrap: balance;
  }
  p, ul { margin: 0; }
  ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
  .muted { color: var(--muted); }
  a { color: var(--brand); text-underline-offset: 2px; }
  :root[data-theme="dark"] a { color: #8FB3FF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) a { color: #8FB3FF; } }
  footer { border-top: 1px solid var(--line); padding-top: 20px; font-size: 15px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="eyebrow">Unfold for iPhone</span>
    <h1>Support</h1>
  </div>
</header>

<main>
  <div class="wrap">

    <section>
      <h2>FAQ</h2>
      <p>None yet!</p>
    </section>

    <section>
      <h2>Contact</h2>
      <p><a href="mailto:tom@writelogic.co.uk">tom@writelogic.co.uk</a></p>
    </section>

  
  </div>
</main>
</body>
</html>
